server.address=127.0.0.1
server.port=${CHAT_PORT:8087}

chat.workspace=${CHAT_WORKSPACE:${user.home}/.agentscope/haizhuo-demo}
# 当前演示会话使用的用户命名空间；接入登录后应改为从认证身份取得。
chat.user-id=${CHAT_USER_ID:1}

chat.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
chat.endpoint-path=/chat/completions
chat.model=deepseek-v4.1-flash-1017
chat.api-key=${CHAT_API_KEY:}

spring.main.banner-mode=off

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/agent_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&zeroDateTimeBehavior=convertToNull&allowMultiQueries=true&rewriteBatchedStatements=true}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=LocalHikariPool
